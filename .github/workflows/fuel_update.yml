name: Weekly Fuel Price Sync

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  fuel-sync:
    name: Fetch EIA Diesel Price and Insert to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet supabase requests

      - name: Run fuel sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python cron_fuel_sync.py
